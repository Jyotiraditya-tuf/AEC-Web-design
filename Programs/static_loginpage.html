<!DOCTYPE html>
<html>
    <head>
        <title>Login Page</title>
    </head>
    <body background="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS_BuXCty9IYpxQxbsihnR-2usianTuwdtRotmm9mD4qA&s=10" background-repeat="no-repeat" background-size="cover">
        <h1><center>Login portal</center></h1>
        
        <!-- The form tag wraps everything that needs to be submitted or reset -->
        <form>
            <table border="1" cellpadding="10" cellspacing="5" width="300" 
            align="center" bgcolor="turquoise">

            <tr>
                <th><center>Name</center></th>
                <th><input type="text"></th>
            </tr>
            <tr>
                <th><center>Password</center></th>
                <th><input type="password"></th>
            </tr>
            <tr>
                <th><center>DOB</center></th>
                <th><input type="date"></th>
            </tr>
            <tr>
                <th colspan="2"><center><input type="submit" value="Login"></center></th>
            </tr>
            <tr>
                <th colspan="2"><center><input type="reset" value="Reset"></center></th>
            </tr>
                
            </table>
        </form>
        
    </body>
</html>
