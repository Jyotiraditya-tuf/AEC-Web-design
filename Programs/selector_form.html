<!DOCTYPE html>
<html>
<head>
  <title>CSS Selectors</title>
  <style>
    /* 1. Universal Selector */
    * {
      font-family: Arial;
    }

    /* 2. Element Selector */
    h1 {
      color: blue;
    }

    /* 3. ID Selector */
    #one {
      color: green;
    }

    /* 4. Class Selector */
    .box {
      background-color: yellow;
      padding: 5px;
    }

    /* 5. Group Selector */
    h2, p {
      text-align: center;
    }

    /* 6. Descendant Selector */
    div p {
      color: red;
    }
  </style>
</head>
<body>

  <!-- Element Selector -->
  <h1>Heading 1 (Element Selector)</h1>

  <!-- ID Selector -->
  <h2 id="one">Heading 2 (ID Selector: #one)</h2>

  <!-- Class Selector -->
  <div class="box">
    This div uses the Class Selector (.box)
  </div>

  <!-- Group Selector -->
  <p>Standard paragraph styled by Group Selector</p>

  <!-- Descendant Selector -->
  <div>
    <p>Paragraph inside div styled by Descendant Selector (div p)</p>
  </div>

</body>
</html>
