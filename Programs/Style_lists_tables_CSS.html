<!DOCTYPE html>
<html>
<head>
  <title>Styled Lists and Tables</title>
  <style>
    /* List Styling */
    ul {
      list-style-type: square;
      background-color: lightgray;
      padding: 20px;
      width: 200px;
    }

    /* Table Styling */
    table {
      width: 50%;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid black;
      padding: 8px;
      text-align: left;
    }

    th {
      background-color: green;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>

  <h2>Subjects</h2>
  <ul>
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
  </ul>

  <h2>Marks Table</h2>
  <table>
    <tr>
      <th>Name</th>
      <th>Marks</th>
    </tr>
    <tr>
      <td>Amit</td>
      <td>85</td>
    </tr>
    <tr>
      <td>Riya</td>
      <td>92</td>
    </tr>
  </table>

</body>
</html>
